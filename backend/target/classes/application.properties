server.port=${PORT:8080}
spring.application.name=almoxarifado-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/almoxarifado}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:almoxarifado}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:almoxarifado}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:change-this-local-development-secret-before-deploying-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.admin.username=${ADMIN_USERNAME:davi}
app.admin.password=${ADMIN_PASSWORD:1234}
app.admin.name=${ADMIN_NAME:Administrador}
app.whatsapp.default=${WHATSAPP_PADRAO:5531988608306}
