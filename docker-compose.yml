services:
  postgres:
    image: postgres:16-alpine
    container_name: almoxarifado-postgres
    environment:
      POSTGRES_DB: almoxarifado
      POSTGRES_USER: almoxarifado
      POSTGRES_PASSWORD: almoxarifado
    ports:
      - "5432:5432"
    volumes:
      - almoxarifado-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almoxarifado -d almoxarifado"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/almoxarifado
      SPRING_DATASOURCE_USERNAME: almoxarifado
      SPRING_DATASOURCE_PASSWORD: almoxarifado
      JWT_SECRET: local-development-secret-change-this-in-production-42
      ADMIN_USERNAME: davi
      ADMIN_PASSWORD: 1234
      ADMIN_NAME: Administrador
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  almoxarifado-db:
