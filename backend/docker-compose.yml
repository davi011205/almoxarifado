services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: almoxarifado
      POSTGRES_USER: almoxarifado
      POSTGRES_PASSWORD: almoxarifado
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almoxarifado -d almoxarifado"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/almoxarifado
      SPRING_DATASOURCE_USERNAME: almoxarifado
      SPRING_DATASOURCE_PASSWORD: almoxarifado
      JWT_SECRET: change-this-local-development-secret-before-deploying-please
      ADMIN_USERNAME: davi
      ADMIN_PASSWORD: "1234"
      ADMIN_NAME: Administrador
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
